<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>WebhookFlare - Real-time webhook testing</title>
	<link rel="describedby" href="/llms.txt" />
	<script src="https://cdn.tailwindcss.com"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
	<style>
		* { scrollbar-color: #d4d4d4 transparent; scrollbar-width: thin; }
		body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		.mono, .mono * { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
		.method-EMAIL { color: #9a3412; background: #ffedd5; }
		.method-GET { color: #15803d; background: #dcfce7; }
		.method-POST { color: #1d4ed8; background: #dbeafe; }
		.method-PUT { color: #a16207; background: #fef9c3; }
		.method-DELETE { color: #be123c; background: #ffe4e6; }
		.method-PATCH { color: #6d28d9; background: #ede9fe; }
		.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
		.status-connected { background: #10b981; }
		.status-disconnected { background: #9ca3af; }
		.json-key { color: #1d4ed8; }
		.json-str { color: #047857; }
		.json-num { color: #b45309; }
		.json-bool { color: #7c3aed; }
		.json-null { color: #78716c; }
		.xml-tag { color: #1d4ed8; }
		.xml-attr { color: #b45309; }
		.xml-str { color: #047857; }
		.xml-comment { color: #a8a29e; }
		.request-selected { background: #e0f2fe; box-shadow: inset 3px 0 0 #0284c7; }
	</style>
</head>

<body class="bg-neutral-100 h-screen overflow-hidden text-neutral-900" x-data="webhookApp()" x-init="init()">
	<div class="h-full flex flex-col">
		<div class="border-b border-neutral-200 bg-white px-4 py-2.5 flex items-center justify-between gap-4 flex-shrink-0">
			<div class="min-w-0">
				<h1 class="font-semibold leading-none">WebhookFlare</h1>
				<p class="text-xs text-neutral-500 mt-1">Inspect captured requests</p>
			</div>
			<div class="flex items-center gap-3 text-sm text-neutral-600 shrink-0">
				<span class="status-dot" :class="statusClass"></span>
				<span x-text="statusText"></span>
				<span class="text-neutral-400" x-show="!isExpired && timeLeft">expires <span class="font-mono text-neutral-800" x-text="timeLeft"></span></span>
				<span class="text-red-600" x-show="isExpired">expired</span>
				<span class="font-mono" x-text="filteredRequests.length + (query ? '/' + requests.length : '') + ' requests'"></span>
			</div>
		</div>

		<div class="border-b border-neutral-200 bg-white px-4 py-2 flex flex-col gap-2 flex-shrink-0">
			<div class="flex items-center gap-2">
				<span class="text-xs text-neutral-500 w-12 shrink-0">Hook</span>
				<input type="text" readonly class="flex-1 min-w-0 px-2 py-1.5 border border-neutral-300 bg-neutral-50 mono text-xs rounded" :value="webhookUrl" />
				<button class="px-2.5 py-1.5 bg-neutral-900 text-white text-xs rounded" @click="copyToClipboard()" x-text="copyButtonText"></button>
				<label class="text-xs text-neutral-500 shrink-0">Keep</label>
				<select x-model="ttl" class="px-2 py-1.5 border border-neutral-300 bg-white text-xs rounded">
					<option value="1h">1 hour</option>
					<option value="6h">6 hours</option>
					<option value="24h">24 hours</option>
					<option value="7d">7 days</option>
					<option value="30d">30 days</option>
				</select>
				<button class="px-2.5 py-1.5 border border-neutral-300 text-xs rounded bg-white" @click="generateNewWebhook()">New</button>
			</div>
			<div class="flex items-center gap-2">
				<span class="text-xs text-neutral-500 w-12 shrink-0">Email</span>
				<input type="text" readonly class="flex-1 min-w-0 px-2 py-1.5 border border-neutral-300 bg-neutral-50 mono text-xs rounded" :value="emailAddress" />
				<button class="px-2.5 py-1.5 border border-neutral-300 text-xs rounded bg-white" @click="copyEmail()" x-text="copyEmailText"></button>
			</div>
		</div>

		<div class="flex flex-1 min-h-0">
			<aside class="w-80 border-r border-neutral-200 bg-white flex flex-col min-h-0">
				<div class="p-2 border-b border-neutral-200">
					<input x-model="query" type="search" placeholder="Filter caller, operation, body…" class="w-full px-2 py-1.5 border border-neutral-300 rounded text-sm" />
				</div>
				<div class="flex-1 overflow-y-auto">
					<template x-if="filteredRequests.length === 0">
						<p class="text-sm text-neutral-400 text-center py-10" x-text="requests.length ? 'No matches' : 'Waiting for requests…'"></p>
					</template>
					<template x-for="request in filteredRequests" :key="request.id">
						<button type="button" class="w-full text-left px-3 py-2 border-b border-neutral-100 hover:bg-neutral-50"
							:id="'req-' + request.id"
							:class="selectedRequestId === request.id ? 'request-selected' : ''"
							:aria-current="selectedRequestId === request.id ? 'true' : 'false'"
							@click="selectRequest(request.id)">
							<div class="flex items-center gap-2">
								<span class="method-badge" :class="`method-${request.method}`" x-text="request.method"></span>
								<span class="text-[11px] text-neutral-400 mono ml-auto" x-text="formatDate(request.timestamp)"></span>
							</div>
							<div class="mt-1 text-sm font-medium leading-snug break-words" x-text="summary(request).title"></div>
							<div class="mt-0.5 text-xs text-neutral-500 truncate" x-show="summary(request).subtitle" x-text="summary(request).subtitle"></div>
						</button>
					</template>
				</div>
			</aside>

			<section class="flex-1 min-w-0 flex flex-col bg-neutral-50">
				<template x-if="!selectedRequest">
					<div class="m-auto text-sm text-neutral-400">Select a request</div>
				</template>
				<template x-if="selectedRequest">
					<div class="flex flex-col min-h-0 h-full">
						<div class="px-4 py-2 bg-white border-b border-neutral-200 flex items-center gap-2 flex-shrink-0">
							<span class="method-badge" :class="`method-${selectedRequest.method}`" x-text="selectedRequest.method"></span>
							<span class="text-xs text-neutral-400 mono" x-text="'#' + selectedRequest.id"></span>
							<span class="text-xs text-neutral-500 mono" x-text="formatDate(selectedRequest.timestamp)"></span>
							<div class="ml-auto flex gap-1">
								<button class="px-2 py-1 text-xs rounded border" :class="tab === 'body' ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white border-neutral-300'" @click="tab = 'body'">Body</button>
								<button class="px-2 py-1 text-xs rounded border" :class="tab === 'headers' ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white border-neutral-300'" @click="tab = 'headers'">Headers</button>
								<button class="px-2 py-1 text-xs rounded border" :class="tab === 'meta' ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white border-neutral-300'" @click="tab = 'meta'">Metadata</button>
								<button class="px-2 py-1 text-xs rounded border bg-white border-neutral-300" @click="copyActive()" x-text="copyStates.active"></button>
							</div>
						</div>
						<div class="flex-1 overflow-auto p-4">
							<template x-if="tab === 'body'">
								<div class="bg-white border border-neutral-200 rounded-md">
									<template x-if="!selectedRequest.body">
										<p class="p-4 text-sm text-neutral-400">No body</p>
									</template>
									<template x-if="selectedRequest.body && bodyFields(selectedRequest)">
										<div class="divide-y divide-neutral-100">
											<template x-for="field in bodyFields(selectedRequest)" :key="field.key">
												<div class="grid grid-cols-[11rem_minmax(0,1fr)] gap-3 px-4 py-2.5">
													<div class="text-xs text-neutral-500 pt-0.5 break-words">
														<span x-text="field.key"></span>
														<span x-show="field.lang !== 'text'" class="ml-1 uppercase tracking-wide text-[10px] text-sky-700" x-text="field.lang"></span>
													</div>
													<pre x-show="field.html" class="text-sm mono whitespace-pre-wrap break-all" x-html="field.html"></pre>
													<pre x-show="!field.html" class="text-sm mono whitespace-pre-wrap break-all text-neutral-900" x-text="field.value"></pre>
												</div>
											</template>
										</div>
									</template>
									<template x-if="selectedRequest.body && !bodyFields(selectedRequest)">
										<pre class="p-4 text-sm mono whitespace-pre-wrap break-all" x-html="highlightedBody(selectedRequest)"></pre>
									</template>
								</div>
							</template>
							<template x-if="tab === 'headers'">
								<div class="bg-white border border-neutral-200 rounded-md divide-y divide-neutral-100">
									<template x-for="[key, value] in getHeaders(selectedRequest)" :key="key">
										<div class="grid grid-cols-[14rem_minmax(0,1fr)] gap-3 px-4 py-2">
											<div class="text-xs text-neutral-500 break-all" x-text="key"></div>
											<div class="text-sm mono break-all" x-text="value"></div>
										</div>
									</template>
								</div>
							</template>
							<template x-if="tab === 'meta'">
								<div class="bg-white border border-neutral-200 rounded-md divide-y divide-neutral-100">
									<template x-if="!getMetadata(selectedRequest)">
										<p class="p-4 text-sm text-neutral-400">No metadata</p>
									</template>
									<template x-for="[key, value] in Object.entries(getMetadata(selectedRequest) || {})" :key="key">
										<div class="grid grid-cols-[11rem_minmax(0,1fr)] gap-3 px-4 py-2">
											<div class="text-xs text-neutral-500" x-text="formatMetadataKey(key)"></div>
											<div class="text-sm mono break-all" x-text="value"></div>
										</div>
									</template>
								</div>
							</template>
						</div>
					</div>
				</template>
			</section>
		</div>
	</div>

	<script>
		function webhookApp() {
			return {
				ws: null,
				currentBinId: null,
				requests: [],
				selectedRequestId: null,
				pendingReq: null,
				status: 'connecting',
				statusText: 'Connecting',
				copyButtonText: 'Copy URL',
				copyEmailText: 'Copy',
				copyStates: { active: 'Copy' },
				expiresAt: null,
				timeLeft: '',
				timerInterval: null,
				isExpired: false,
				ttl: '6h',
				query: '',
				tab: 'body',

				get webhookUrl() {
					return this.currentBinId ? `${window.location.origin}/hook/${this.currentBinId}` : 'Generating...';
				},
				get emailAddress() {
					return this.currentBinId ? `${this.currentBinId}@webhook.t-iq.me` : 'Generating...';
				},
				get selectedRequest() {
					return this.requests.find((r) => r.id === this.selectedRequestId) || null;
				},
				get filteredRequests() {
					const q = this.query.trim().toLowerCase();
					if (!q) return this.requests;
					return this.requests.filter((r) => {
						const s = this.summary(r);
						return [r.method, r.body, r.headers, r.query, s.title, s.subtitle].join('\n').toLowerCase().includes(q);
					});
				},
				get statusClass() {
					if (this.status === 'connected') return 'status-dot status-connected';
					if (this.status === 'error') return 'status-dot bg-red-500';
					return 'status-dot status-disconnected';
				},

				async init() {
					const params = new URLSearchParams(window.location.search);
					const binId = params.get('id');
					this.pendingReq = params.get('req');
					if (params.get('ttl')) this.ttl = params.get('ttl');
					if (binId) {
						this.currentBinId = binId;
						this.connectWebSocket();
					} else {
						await this.generateNewWebhook();
					}
				},

				async generateNewWebhook() {
					try {
						const response = await fetch(`/api/new?ttl=${encodeURIComponent(this.ttl)}`);
						const data = await response.json();
						if (!response.ok || !data.id) {
							this.status = 'error';
							this.statusText = data.error || 'Failed to create webhook';
							return;
						}
						this.currentBinId = data.id;
						this.isExpired = false;
						this.status = 'connecting';
						this.statusText = 'Connecting';
						this.requests = [];
						this.selectedRequestId = null;
						this.query = '';
						this.timeLeft = '';
						if (this.timerInterval) clearInterval(this.timerInterval);
						if (data.expiresAt) {
							this.expiresAt = data.expiresAt;
							this.startTimer();
						}
						window.history.pushState({}, '', `?id=${this.currentBinId}`);
						this.connectWebSocket();
					} catch (error) {
						console.error('Error generating webhook:', error);
						this.status = 'error';
						this.statusText = 'Failed to create webhook';
					}
				},

				connectWebSocket() {
					if (this.ws) this.ws.close();
					const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
					this.ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/${this.currentBinId}`);
					this.ws.onopen = () => { this.status = 'connected'; this.statusText = 'Connected'; };
					this.ws.onmessage = async (event) => {
						const message = JSON.parse(event.data);
						if (message.type === 'initial_data') {
							this.requests = message.data;
							if (message.expiresAt) { this.expiresAt = message.expiresAt; this.startTimer(); }
							this.applySelection(this.pendingReq);
							this.pendingReq = null;
							this.$nextTick(() => this.scrollSelected());
						} else if (message.type === 'new_request') {
							this.requests.unshift({ ...message.data, isNew: true });
							if (this.selectedRequestId == null) this.applySelection(message.data.id);
						} else if (message.type === 'deleted' && message.reason === 'expired') {
							this.isExpired = true;
							this.status = 'expired';
							this.statusText = 'Expired';
							this.timeLeft = '';
							if (this.timerInterval) clearInterval(this.timerInterval);
							this.ws.close();
						}
					};
					this.ws.onerror = () => { this.status = 'error'; this.statusText = 'Connection error'; };
					this.ws.onclose = () => {
						if (this.isExpired) return;
						this.status = 'disconnected';
						this.statusText = 'Disconnected';
						setTimeout(() => this.connectWebSocket(), 3000);
					};
				},

				selectRequest(id) {
					this.selectedRequestId = id;
					this.tab = 'body';
					this.syncUrl();
				},
				applySelection(prefer) {
					const wanted = prefer ?? this.selectedRequestId;
					const match = this.requests.find((r) => String(r.id) === String(wanted));
					if (match) this.selectedRequestId = match.id;
					else if (this.selectedRequestId == null && this.requests.length) this.selectedRequestId = this.requests[0].id;
					this.syncUrl();
				},
				syncUrl() {
					if (!this.currentBinId) return;
					const params = new URLSearchParams();
					params.set('id', this.currentBinId);
					if (this.selectedRequestId != null) params.set('req', String(this.selectedRequestId));
					const next = `?${params}`;
					if (window.location.search !== next) history.replaceState({}, '', next);
				},
				scrollSelected() {
					const el = document.getElementById(`req-${this.selectedRequestId}`);
					if (el) el.scrollIntoView({ block: 'nearest' });
				},

				parsedBody(request) {
					if (!request?.body) return null;
					try { return JSON.parse(request.body); } catch { return null; }
				},
				summary(request) {
					const body = this.parsedBody(request);
					if (body && typeof body === 'object' && !Array.isArray(body)) {
						if (body.subject) {
							return { title: String(body.subject), subtitle: body.from ? String(body.from) : '' };
						}
						const op = body.OperationName || body.operation || body.event || body.type || body.action;
						const title = op
							? String(op).split('/').filter(Boolean).slice(-2).join('/')
							: (body.Category || 'JSON object');
						const subtitle = [body.Category, body.Result, body.Caller || body.caller].filter(Boolean).join(' · ');
						return { title: String(title), subtitle };
					}
					if (Array.isArray(body)) return { title: `Array (${body.length})`, subtitle: '' };
					const preview = (request.body || 'No body').replace(/\s+/g, ' ');
					return { title: preview.length > 140 ? preview.slice(0, 140) + '…' : preview, subtitle: '' };
				},
				formatValue(value) {
					if (typeof value === 'string') {
						const trimmed = value.trim();
						if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
							try { return JSON.stringify(JSON.parse(trimmed), null, 2); } catch { /* keep raw */ }
						}
						return value;
					}
					return JSON.stringify(value, null, 2);
				},
				bodyFields(request) {
					const body = this.parsedBody(request);
					if (!body || typeof body !== 'object' || Array.isArray(body)) return null;
					return Object.entries(body).map(([key, value]) => this.codeField(key, value, request));
				},
				codeField(key, value) {
					const text = this.formatValue(value);
					const sniffed = this.detectLang(text, '');
					const structured = sniffed !== 'text' && (text.includes('\n') || /^[[{<]/.test(text.trim()));
					const code = key === 'Raw' || structured;
					const lang = code ? (sniffed === 'text' ? 'json' : sniffed) : 'text';
					return { key, value: text, lang, html: code ? this.highlight(text, lang) : '' };
				},
				contentType(request) {
					const hit = this.getHeaders(request).find(([key]) => key.toLowerCase() === 'content-type');
					return hit ? hit[1] : '';
				},
				prettyBody(request) {
					const body = this.parsedBody(request);
					return body == null ? (request.body || '') : JSON.stringify(body, null, 2);
				},
				highlightedBody(request) {
					const text = this.prettyBody(request);
					return this.highlight(text, this.detectLang(text, this.contentType(request)));
				},
				detectLang(text, contentType) {
					const ct = (contentType || '').toLowerCase();
					if (ct.includes('json')) return 'json';
					if (ct.includes('html')) return 'html';
					if (ct.includes('xml')) return 'xml';
					if (ct.includes('yaml') || ct.includes('yml')) return 'yaml';
					const trimmed = (text || '').trim();
					if (!trimmed) return 'text';
					if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
						try { JSON.parse(trimmed); return 'json'; } catch { /* not json */ }
					}
					if (trimmed.startsWith('<?xml') || trimmed.startsWith('<')) return /<html[\s>]/i.test(trimmed) ? 'html' : 'xml';
					if (/^(---|%YAML)/.test(trimmed)) return 'yaml';
					return 'text';
				},
				escapeHtml(value) {
					return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
				},
				highlight(text, lang) {
					if (lang === 'json') return this.highlightJson(text);
					if (lang === 'xml' || lang === 'html') return this.highlightXml(text);
					return this.escapeHtml(text);
				},
				highlightJson(src) {
					let i = 0;
					let out = '';
					while (i < src.length) {
						const c = src[i];
						if (c === '"') {
							let j = i + 1;
							while (j < src.length) {
								if (src[j] === '\\') { j += 2; continue; }
								if (src[j] === '"') { j++; break; }
								j++;
							}
							const token = src.slice(i, j);
							let k = j;
							while (src[k] === ' ' || src[k] === '\t') k++;
							out += `<span class="${src[k] === ':' ? 'json-key' : 'json-str'}">${this.escapeHtml(token)}</span>`;
							i = j;
							continue;
						}
						if (c === '-' || (c >= '0' && c <= '9')) {
							const match = src.slice(i).match(/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/);
							if (match) {
								out += `<span class="json-num">${match[0]}</span>`;
								i += match[0].length;
								continue;
							}
						}
						const word = src.startsWith('true', i) ? 'true' : src.startsWith('false', i) ? 'false' : src.startsWith('null', i) ? 'null' : '';
						if (word && !/[A-Za-z0-9_]/.test(src[i + word.length] || '')) {
							out += `<span class="${word === 'null' ? 'json-null' : 'json-bool'}">${word}</span>`;
							i += word.length;
							continue;
						}
						out += this.escapeHtml(c);
						i++;
					}
					return out;
				},
				highlightXml(src) {
					return this.escapeHtml(src)
						.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="xml-comment">$1</span>')
						.replace(/(&lt;\/?)([A-Za-z_:][\w:.-]*)/g, '$1<span class="xml-tag">$2</span>')
						.replace(/([A-Za-z_:][\w:.-]*)(=)(&quot;[^&]*&quot;)/g, '<span class="xml-attr">$1</span>$2<span class="xml-str">$3</span>');
				},
				getHeaders(request) {
					try { return Object.entries(JSON.parse(request.headers)); } catch { return []; }
				},
				getMetadata(request) {
					if (!request?.metadata) return null;
					try {
						const metadata = JSON.parse(request.metadata);
						const filtered = {};
						for (const [key, value] of Object.entries(metadata)) {
							if (value !== null && value !== undefined && value !== '') filtered[key] = value;
						}
						return Object.keys(filtered).length ? filtered : null;
					} catch { return null; }
				},
				formatMetadataKey(key) {
					if (key === 'userIP') return 'User IP';
					const formatted = key.replace(/([A-Z])/g, ' $1').trim();
					return formatted.charAt(0).toUpperCase() + formatted.slice(1);
				},
				formatDate(timestamp) {
					return new Date(timestamp).toLocaleString('en-US', {
						month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
					});
				},
				async copyToClipboard() {
					await navigator.clipboard.writeText(this.webhookUrl);
					this.copyButtonText = 'Copied';
					setTimeout(() => { this.copyButtonText = 'Copy URL'; }, 1200);
				},
				async copyEmail() {
					await navigator.clipboard.writeText(this.emailAddress);
					this.copyEmailText = 'Copied';
					setTimeout(() => { this.copyEmailText = 'Copy'; }, 1200);
				},
				async copyActive() {
					if (!this.selectedRequest) return;
					let text = '';
					if (this.tab === 'headers') text = JSON.stringify(Object.fromEntries(this.getHeaders(this.selectedRequest)), null, 2);
					else if (this.tab === 'meta') text = JSON.stringify(this.getMetadata(this.selectedRequest) || {}, null, 2);
					else text = this.prettyBody(this.selectedRequest);
					await navigator.clipboard.writeText(text);
					this.copyStates.active = 'Copied';
					setTimeout(() => { this.copyStates.active = 'Copy'; }, 1200);
				},
				startTimer() {
					if (this.timerInterval) clearInterval(this.timerInterval);
					const updateTimer = () => {
						if (!this.expiresAt) return;
						const diff = this.expiresAt - Date.now();
						if (diff <= 0) {
							this.isExpired = true;
							this.status = 'expired';
							this.statusText = 'Expired';
							clearInterval(this.timerInterval);
							return;
						}
						const days = Math.floor(diff / 86400000);
						const hours = Math.floor((diff % 86400000) / 3600000);
						const minutes = Math.floor((diff % 3600000) / 60000);
						const seconds = Math.floor((diff % 60000) / 1000);
						let time = '';
						if (days) time += `${days}d `;
						if (hours || days) time += `${hours}h `;
						time += `${minutes}m ${seconds}s`;
						this.timeLeft = time.trim();
					};
					updateTimer();
					this.timerInterval = setInterval(updateTimer, 1000);
				},
			};
		}
	</script>
</body>
